bled{opacity:.3}.navinfo{flex:1;text-align:center}.progress{height:5px;background:#2c3549;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--lime);width:0;transition:width .2s}.navhint{color:var(--muted);font-size:12px;margin:8px 0 0}.result{text-align:center;margin:auto}.stars{font-size:26px;letter-spacing:5px;margin-bottom:20px}.primary,.secondary{border-radius:14px;border:0;padding:14px 18px;margin:5px;font-weight:800}.primary{background:var(--lime);color:#132313}.secondary{color:white;background:#283348}.footer{padding:16px 0 22px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.footer a{color:var(--lime)}@media(max-width:540px){.top{height:62px}.brand{font-size:19px}.grade{font-size:10px}.card{min-height:480px}.shell{padding:0 14px}main{margin:20px auto}.tab{padding:9px 12px;font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
'use strict';
const burgLessons=[{"icon":"🏰","name":"Warum gab es Burgen?","text":"Im Mittelalter boten Burgen Schutz. Dort wohnten und arbeiteten Menschen. Burgen halfen außerdem, Wege und Gebiete zu überwachen.","key":"Burgen dienten Schutz, Wohnen und Herrschaft.","theme":"blue","q":"Wozu baute man viele Burgen?","options":["Zum Schutz und zur Überwachung","Nur zum Spielen","Nur für Gottesdienste"],"answer":0,"why":"Burgen schützten Menschen und wichtige Orte."},{"icon":"⛰️","name":"Der Standort","text":"Viele Burgen standen auf Hügeln. Von dort konnten Menschen die Umgebung gut überblicken. Andere Burgen lagen an wichtigen Wegen oder Flüssen.","key":"Ein guter Standort war wichtig.","theme":"green","q":"Warum standen viele Burgen erhöht?","options":["Damit es wärmer war","Für gute Sicht und sicheren Zugang","Damit sie näher an Wolken waren"],"answer":1,"why":"Von oben sah man weit und konnte Angriffe erschweren."},{"icon":"🗼","name":"Der Bergfried","text":"Der Bergfried war ein hoher, besonders fester Turm mit dicken Mauern. Er konnte als letzter Rückzugsort dienen. Meist wohnte man nicht darin.","key":"Bergfried = fester Turm und Rückzugsort.","theme":"orange","q":"Was war ein Bergfried?","options":["Der Pferdestall","Ein Wasserbecken","Ein starker Turm"],"answer":2,"why":"Der Bergfried gehörte zu den festen Türmen der Burg."},{"icon":"🧱","name":"Die Burgmauer","text":"Dicke Mauern schützten Gebäude und Menschen. Auf der Mauer konnten Wächter ihre Umgebung beobachten.","key":"Die Burgmauer schützte die Burg.","theme":"blue","q":"Wozu diente die Burgmauer?","options":["Zum Schutz vor Angreifern","Zum Aufbewahren von Wasser","Als Stall"],"answer":0,"why":"Die Burgmauer bildete eine wichtige Schutzanlage."},{"icon":"🏯","name":"Mauertürme","text":"In und an den Burgmauern standen häufig weitere Türme. Von ihnen aus konnten mehrere Seiten der Burg überwacht werden.","key":"Mauertürme halfen bei der Bewachung.","theme":"green","q":"Warum gab es Mauertürme?","options":["Damit der Graben tiefer wurde","Zum Beobachten und Verteidigen","Damit die Tiere schlafen konnten"],"answer":1,"why":"Von Mauertürmen überblickte man verschiedene Seiten der Burg."},{"icon":"♜","name":"Zinnen","text":"Zinnen sind die steinernen Zacken am oberen Rand einer Mauer. Hinter den höheren Teilen fand man Deckung.","key":"Zinnen = Zacken oben auf der Mauer.","theme":"orange","q":"Was sind Zinnen?","options":["Schmale Gräben","Kleine Kapellen","Steinerne Mauerzacken"],"answer":2,"why":"Die steinernen Zacken an Mauer und Turm heißen Zinnen."},{"icon":"🎯","name":"Schießscharten","text":"Schießscharten waren schmale Öffnungen in Mauern oder Türmen. Von dort konnte man die Umgebung beobachten und sich verteidigen.","key":"Schießscharten = schmale Maueröffnungen.","theme":"blue","q":"Was ist eine Schießscharte?","options":["Eine schmale Maueröffnung","Eine Brücke","Ein großer Saal"],"answer":0,"why":"Schießscharten sind schmale Öffnungen in einer Mauer."},{"icon":"🚶","name":"Der Wehrgang","text":"Ein Wehrgang führte an der Innenseite der Burgmauer entlang. Wächter konnten dort ihre Runden machen.","key":"Wehrgang = Weg entlang der Mauer.","theme":"green","q":"Wozu diente der Wehrgang?","options":["Als Pferdestall","Als Weg für Wächter","Als Brunnen"],"answer":1,"why":"Wächter nutzten den Wehrgang entlang der Mauer."},{"icon":"🌊","name":"Der Burggraben","text":"Ein Graben vor der Mauer erschwerte den Zugang. Manche Gräben waren mit Wasser gefüllt, andere waren trocken.","key":"Nicht jeder Burggraben hatte Wasser.","theme":"orange","q":"Welche Aussage stimmt?","options":["Jeder Graben war ein Teich","Jeder Graben war aus Holz","Es gab nasse und trockene Burggräben"],"answer":2,"why":"Burggräben konnten mit Wasser gefüllt oder trocken sein."},{"icon":"🌉","name":"Die Zugbrücke","text":"Bei manchen Burgen führte eine Zugbrücke über den Graben. Sie konnte angehoben werden, damit der Eingang schwerer zu erreichen war.","key":"Zugbrücke = bewegliche Brücke.","theme":"blue","q":"Was war besonders an einer Zugbrücke?","options":["Man konnte sie hochziehen","Sie bestand immer aus Glas","Sie stand im Palas"],"answer":0,"why":"Eine Zugbrücke ließ sich anheben."},{"icon":"🚧","name":"Das Fallgitter","text":"Ein schweres Gitter aus Holz oder Metall konnte am Burgtor herabgelassen werden. Es sicherte den Eingang.","key":"Fallgitter = Schutz am Tor.","theme":"green","q":"Was machte das Fallgitter?","options":["Es speicherte Wasser","Es sperrte den Tordurchgang","Es trug die Kirchenglocke"],"answer":1,"why":"Das Gitter versperrte den Eingang."},{"icon":"🛡️","name":"Die Pechnase","text":"Eine Pechnase war eine Öffnung über einem Tor oder an einer Mauer. Sie diente der Verteidigung von oben. Heißes Pech wurde nicht ständig verwendet.","key":"Pechnase = Öffnung zur Torverteidigung.","theme":"orange","q":"Wo lag eine Pechnase oft?","options":["Im Brunnen","Im Pferdestall","Über dem Burgtor"],"answer":2,"why":"Pechnasen befanden sich oft über Toren."},{"icon":"🏠","name":"Der Palas","text":"Der Palas war ein Wohn- und Saalgebäude. Dort fanden wichtige Treffen und oft auch Feste statt.","key":"Palas = Wohn- und Saalgebäude.","theme":"blue","q":"Was war der Palas?","options":["Ein großes Wohn- und Saalgebäude","Ein Graben","Ein Gitter am Tor"],"answer":0,"why":"Im Palas befanden sich Wohnräume und oft ein Saal."},{"icon":"⛪","name":"Die Burgkapelle","text":"In der Burgkapelle beteten Menschen und feierten Gottesdienste. Nicht jede Burg hatte eine eigene Kapelle.","key":"Kapelle = Ort für Gebete.","theme":"green","q":"Wozu diente eine Burgkapelle?","options":["Zur Lagerung von Heu","Für Gebete und Gottesdienste","Zum Hochziehen der Brücke"],"answer":1,"why":"Die Kapelle war der religiöse Raum."},{"icon":"🐴","name":"Der Stall","text":"Im Stall waren Pferde und andere Tiere untergebracht. Die Tiere brauchten Futter, Wasser und Pflege.","key":"Stall = Unterkunft für Tiere.","theme":"orange","q":"Welche Tiere lebten häufig im Stall?","options":["Fische","Wildvögel","Pferde"],"answer":2,"why":"Pferde wurden in Ställen versorgt."},{"icon":"💧","name":"Der Brunnen","text":"Ein Brunnen versorgte die Menschen und Tiere auf der Burg mit Wasser. Das war auch wichtig, wenn man nicht hinausgehen konnte.","key":"Brunnen = Wasserversorgung.","theme":"blue","q":"Warum war der Brunnen wichtig?","options":["Er lieferte Wasser","Er ersetzte das Burgtor","Er war ein Wachturm"],"answer":0,"why":"Mit dem Brunnen beschaffte man Wasser."},{"icon":"🔐","name":"Der Kerker","text":"Ein Kerker war ein gesicherter Raum für Gefangene. Nicht jede Burg hatte ein eigenes unterirdisches Verlies.","key":"Kerker = Raum für Gefangene.","theme":"green","q":"Was war ein Kerker?","options":["Eine Küche","Ein Raum für Gefangene","Eine Brücke"],"answer":1,"why":"In gesicherten Räumen konnten Gefangene festgehalten werden."},{"icon":"🧺","name":"Der Burghof","text":"Im Burghof fanden alltägliche Arbeiten statt. Menschen brachten Waren, kümmerten sich um Tiere und gingen zwischen den Gebäuden hin und her.","key":"Im Burghof spielte sich der Alltag ab.","theme":"orange","q":"Was passierte im Burghof?","options":["Dort wurde nur geschlafen","Dort war immer ein See","Dort arbeiteten Menschen"],"answer":2,"why":"Im Burghof erledigte man viele Aufgaben."},{"icon":"🚪","name":"Das Burgtor","text":"Das Burgtor war ein wichtiger Zugang zur Burg. Es wurde oft besonders gut geschützt.","key":"Burgtor = geschützter Zugang.","theme":"blue","q":"Warum war das Burgtor wichtig?","options":["Es war der Eingang","Dort standen alle Betten","Dort holte man Grundwasser"],"answer":0,"why":"Am Eingang musste die Burg besonders gut gesichert werden."},{"icon":"👩‍🍳","name":"Menschen auf der Burg","text":"Auf Burgen lebten nicht nur Ritter. Auch Familien, Mägde, Knechte, Köche und Handwerker wohnten oder arbeiteten dort.","key":"Auf der Burg arbeiteten viele Menschen.","theme":"green","q":"Wer lebte auf einer Burg?","options":["Nur Ritter","Menschen mit vielen Aufgaben","Nur Könige"],"answer":1,"why":"Viele unterschiedliche Menschen hielten den Burgalltag am Laufen."}];
const knightLessons=[{"icon":"🛡️","name":"Wer waren Ritter?","text":"Ritter waren ausgebildete Reiter im Dienst eines Herrschers oder Adligen. Viele kamen aus adeligen Familien.","key":"Ritter hatten besondere Pflichten.","theme":"blue","q":"Wer waren Ritter im Mittelalter?","options":["Nur Könige","Nur Bauern","Ausgebildete Reiter im Dienst eines Herrn"],"answer":2,"why":"Ritter dienten einem Herrscher oder Adligen."},{"icon":"📜","name":"Die Aufgaben der Ritter","text":"Ritter unterstützten ihren Herrn. Sie konnten Burgen schützen, reisen oder Aufgaben in der Verwaltung erledigen.","key":"Ritter hatten verschiedene Aufgaben.","theme":"green","q":"Welche Aufgabe konnte ein Ritter haben?","options":["Eine Burg bewachen","Nur den Brunnen säubern","Immer die Messe leiten"],"answer":0,"why":"Ritter konnten unter anderem Burgen bewachen."},{"icon":"🧒","name":"Der Page","text":"Ein Junge begann seine Ritterausbildung manchmal mit etwa sieben Jahren als Page. Er lernte höfliches Verhalten und half im Haushalt.","key":"Page = erste Ausbildungsstufe.","theme":"orange","q":"Wie hieß die erste Stufe der Ritterausbildung?","options":["Knappe","Page","Burgherr"],"answer":1,"why":"Als Page begann häufig die Ausbildung."},{"icon":"🧑‍🏫","name":"Der Knappe","text":"Mit ungefähr 14 Jahren konnte ein Page Knappe werden. Er half einem erfahrenen Ritter und betreute Ausrüstung und Pferde.","key":"Knappe = zweite Ausbildungsstufe.","theme":"blue","q":"Was machte ein Knappe?","options":["Er leitete immer eine Burg","Er war ein Kirchengebäude","Er unterstützte einen Ritter"],"answer":2,"why":"Ein Knappe begleitete und unterstützte einen erfahrenen Ritter."},{"icon":"✨","name":"Der Ritterschlag","text":"Nach vielen Ausbildungsjahren konnte ein Knappe feierlich zum Ritter ernannt werden. Dies nannte man Ritterschlag oder Schwertleite.","key":"Ritterschlag = Ernennung zum Ritter.","theme":"green","q":"Was war ein Ritterschlag?","options":["Eine feierliche Ernennung zum Ritter","Ein Mauerturm","Ein Pferdestall"],"answer":0,"why":"Mit einem Ritterschlag konnte ein Knappe Ritter werden."},{"icon":"📚","name":"Die Ausbildung","text":"Junge Ritteranwärter lernten Reiten, körperliche Übungen und gutes Benehmen. An manchen Höfen gehörten Musik, Tanz und Lesen dazu.","key":"Ritter lernten auch höfisches Verhalten.","theme":"orange","q":"Was lernten Pagen und Knappen?","options":["Nur Brunnen bauen","Reiten und höfliches Verhalten","Nur Brot backen"],"answer":1,"why":"Zur Ausbildung gehörten Reiten und Umgangsformen."},{"icon":"🤝","name":"Höfisches Benehmen","text":"An Adelshöfen gab es Regeln für den Umgang miteinander. Respektvoll sprechen und freundlich mit Gästen umgehen waren wichtig.","key":"Höfisch bedeutet: am Adelshof angemessen.","theme":"blue","q":"Was bedeutet höfisches Verhalten?","options":["Ein Tor bewachen","Ein Wappen malen","Sich respektvoll verhalten"],"answer":2,"why":"Höfische Regeln betrafen das Verhalten am Hof."},{"icon":"🪖","name":"Die Rüstung","text":"Eine Rüstung sollte einen Ritter schützen. Im Laufe des Mittelalters änderten sich Rüstungen und bestanden zum Beispiel aus Metallringen oder Metallplatten.","key":"Rüstungen sahen nicht immer gleich aus.","theme":"green","q":"Wozu trugen Ritter eine Rüstung?","options":["Zum Schutz","Zum Sammeln von Wasser","Als Ersatz für ein Pferd"],"answer":0,"why":"Rüstungen dienten dem Schutz."},{"icon":"🔗","name":"Das Kettenhemd","text":"Ein Kettenhemd bestand aus vielen kleinen verbundenen Metallringen. Es konnte ziemlich schwer sein.","key":"Kettenhemd = Schutz aus Metallringen.","theme":"orange","q":"Woraus bestand ein Kettenhemd?","options":["Aus Holz","Aus Metallringen","Aus Stroh"],"answer":1,"why":"Kettenhemden bestanden aus vielen Metallringen."},{"icon":"🪖","name":"Helm und Schild","text":"Helme dienten dem Schutz des Kopfes. Schilde boten zusätzlichen Schutz und trugen manchmal ein Wappen.","key":"Helm und Schild waren Schutzteile.","theme":"blue","q":"Was schützte der Helm?","options":["Die Füße","Das Pferd","Den Kopf"],"answer":2,"why":"Ein Helm schützte den Kopf."},{"icon":"🎨","name":"Das Wappen","text":"Ein Wappen zeigte Farben und Symbole. Es konnte als Zeichen einer Familie oder eines Herrschaftsgebietes dienen.","key":"Wappen = Erkennungszeichen.","theme":"green","q":"Wozu war ein Wappen da?","options":["Als Erkennungszeichen","Zum Heben der Zugbrücke","Zum Schöpfen von Wasser"],"answer":0,"why":"Wappen waren sichtbare Erkennungszeichen."},{"icon":"🐎","name":"Ritter und Pferde","text":"Pferde waren für Reisen und Transporte wichtig. Sie brauchten Pflege und Futter. Knappen und Stallknechte halfen dabei.","key":"Pferde waren wertvoll und brauchten Pflege.","theme":"orange","q":"Warum waren Pferde wichtig?","options":["Weil sie Mauern bauten","Weil man mit ihnen reisen konnte","Weil sie Getreide mahlten"],"answer":1,"why":"Pferde waren für das Reiten und Reisen wichtig."},{"icon":"🏟️","name":"Die Turniere","text":"Turniere waren Wettkämpfe, bei denen Ritter ihr Können zeigten. Sie hatten Regeln, waren aber nicht ungefährlich.","key":"Turniere = Wettkämpfe mit Regeln.","theme":"blue","q":"Was war ein Ritterturnier?","options":["Ein Gottesdienst","Ein Arbeitstag im Stall","Ein organisierter Wettkampf"],"answer":2,"why":"Turniere waren organisierte Wettkämpfe."},{"icon":"🏰","name":"Ritter auf der Burg","text":"Manche Ritter lebten oder arbeiteten auf Burgen. Dort waren aber auch Familien, Handwerker, Mägde und Knechte.","key":"Auf Burgen lebten nicht nur Ritter.","theme":"green","q":"Wer lebte außer Rittern auf Burgen?","options":["Auch Handwerker und Familien","Nur Könige","Niemand sonst"],"answer":0,"why":"Eine Burg hatte Bewohner mit verschiedenen Aufgaben."},{"icon":"🍲","name":"Der Alltag","text":"Ritter hatten auch gewöhnliche Pflichten: reisen, Besitztümer verwalten oder sich um ihre Familie kümmern. Nicht jeder Tag war ein Turnier.","key":"Ritter hatten einen ganz normalen Alltag.","theme":"orange","q":"Was gehörte zum Ritteralltag?","options":["Nur Turniere","Reisen und Pflichten erledigen","Immer im Turm schlafen"],"answer":1,"why":"Ritter übernahmen verschiedene Alltagsaufgaben."},{"icon":"👑","name":"Wer konnte Ritter werden?","text":"Oft erhielten Jungen aus adeligen oder wohlhabenden Familien eine Ritterausbildung. Die Herkunft beeinflusste die Möglichkeiten. Adelige Frauen konnten Burgen verwalten.","key":"Nicht alle hatten die gleichen Chancen.","theme":"blue","q":"Welche Aussage zum Ritterstand stimmt?","options":["Jedes Kind musste Ritter werden","Nur Könige wurden Ritter","Die Herkunft spielte oft eine Rolle"],"answer":2,"why":"Der Ritterstand war häufig an soziale Herkunft gebunden."}];

ten Mauertürme?","options":["Zur Beobachtung","Zum Brotbacken","Als Wassertank"],"answer":0,"why":"Türme halfen beim Beobachten der Umgebung."},{"q":"Wo betete man auf vielen Burgen?","options":["Im Kerker","In der Kapelle","Im Stall"],"answer":1,"why":"Eine Kapelle war ein Ort für Gebete."},{"q":"Was erschwerte Angreifern den Zugang?","options":["Die Speisekammer","Der Palas","Der Burggraben"],"answer":2,"why":"Der Graben war ein Hindernis vor der Mauer."},{"q":"Was gehörte zum Burgalltag?","options":["Arbeiten vieler Menschen","Nur Ritterfeste","Nur Kämpfe"],"answer":0,"why":"Mägde, Knechte und Handwerker verrichteten viele Arbeiten."}];

?","options":["Nur eine Stunde","Einen Tag","Mehrere Jahre"],"answer":2,"why":"Page und Knappe waren Stufen über mehrere Jahre."}];
let topic='burgen', lessons=burgLessons, extra=burgExtra;
let mode='learn',index=0,answers={},examQuestions=[];const $=s=>document.querySelector(s),card=$('#card');
function shuffle(items){let a=[...items];for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function setMode(m){$('#mode-options').hidden=true;$('#mode-toggle').setAttribute('aria-expanded','false');$('#mode-name').textContent=({learn:'📖 Lernkarten',practice:'⚡ Quiz',exam:'🎓 Klassenarbeit'})[m];mode=m;index=0;answers={};if(m==='exam'){const pool=x=>x.map(y=>({q:y.q,options:y.options,answer:y.answer,why:y.why}));examQuestions=topic==='both'?shuffle([...shuffle([...pool(burgLessons),...burgExtra]).slice(0,6),...shuffle([...pool(knightLessons),...knightExtra]).slice(0,6)]):shuffle([...pool(lessons),...extra]).slice(0,12);}document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.mode===m);b.setAttribute('aria-pressed',String(b.dataset.mode===m))});render()}
function add(tag,cls,txt,parent=card){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;parent.append(e);return e}
function finish(total){let correct=Object.values(answers).filter(a=>a.correct).length;card.className='card green';const wrap=add('div','result');add('div','visual',correct===total?'🏆':'🌟',wrap);add('h2','title',correct+' von '+total+' richtig!',wrap);add('p','',correct===total?'Klasse! Alle Fragen richtig.':correct>=total*.7?'Gut gemacht! Du weißt schon viel über das Mittelalter.':'Übe die Lernkarten noch einmal und probiere es erneut.',wrap);add('div','stars','⭐'.repeat(Math.max(1,Math.round(correct/total*5))),wrap);const b=add('button','primary','Noch einmal üben',wrap);b.onclick=()=>setMode(mode);const l=add('button','secondary','Lernkarten ansehen',wrap);l.onclick=()=>setMode('learn')}
function render(){card.replaceChildren();const n=mode==='exam'?examQuestions.length:lessons.length;const end=index>=n;$('#meta-label').textContent=mode==='learn'?'✳ ERST VERSTEHEN':mode==='practice'?'✳ WISSEN TESTEN':'✳ PROBE-KLASSENARBEIT';$('#count').textContent=end?'ZIEL':String(index+1).padStart(2,'0')+' / '+String(n).padStart(2,'0');$('#progress-fill').style.width=(end?100:(index+1)/n*100)+'%';$('#hint').textContent=mode==='learn'?'Wisch nach links oder tippe auf →':mode==='exam'?'12 gemischte Fragen · ohne Zeitdruck':'Wähle deine Antwort';$('#prev').disabled=index===0;$('#next').disabled=end||(mode!=='learn'&&!answers[index]);$('#next').textContent=index===n-1?'✓':'→';if(end){if(mode==='learn'){card.className='card green';const wrap=add('div','result');add('div','visual','🎉',wrap);add('h2','title','Super, du hast alle Lernkarten geschafft!',wrap);add('p','body','Du hast die Lernkarten zu deinem Thema geschafft. Bist du bereit für ein paar Fragen? Keine Sorge: Du kannst alles in Ruhe ausprobieren!',wrap);const start=add('button','primary','⚡ Jetzt Quiz starten!',wrap);start.onclick=()=>setMode('practice');const repeat=add('button','secondary','📖 Lernkarten noch mal ansehen',wrap);repeat.onclick=()=>setMode('learn');}else{finish(n)}return}if(mode==='learn'){const x=lessons[index];card.className='card '+x.theme;add('span','pill','✦ LERNKARTE '+String(index+1).padStart(2,'0'));add('div','visual',x.icon);const part=add('div');add('h2','title',x.name,part);add('p','body',x.text,part);add('p','remember','✳ MERKE DIR: '+x.key,part);return}const x=mode==='practice'?lessons[index]:examQuestions[index];card.className='card '+['blue','green','orange'][index%3];add('span','pill',mode==='exam'?'🎓 KLASSENARBEIT':'⚡ QUIZFRAGE');const part=add('div');if(mode==='practice')add('div','visual',lessons[index].icon,part);add('h2','question',x.q,part);const choices=add('div','choices',undefined,part);x.options.forEach((opt,i)=>{const b=add('button','choice',String.fromCharCode(65+i)+'  '+opt,choices);b.type='button';if(answers[index]){b.disabled=true;if(i===x.answer)b.classList.add('correct');if(answers[index].selected===i&&i!==x.answer)b.classList.add('wrong')}b.onclick=()=>{answers[index]={selected:i,correct:i===x.answer};render()}});if(answers[index]){const f=add('div','feedback'+(answers[index].correct?'':' bad'),undefined,part);add('strong','',answers[index].correct?'✓ Richtig!':'↻ Fast! Schau dir die Erklärung an.',f);add('div','',x.why,f)}else add('p','hint','Tippe auf die Antwort, die du richtig findest.',part);if(answers[index]){requestAnimationFrame(()=>{const note=card.querySelector('.feedback');if(note){const noteBottom=note.offsetTop+note.offsetHeight;const visibleBottom=card.scrollTop+card.clientHeight-12;if(noteBottom>visibleBottom)card.scrollTo({top:noteBottom-card.clientHeight+24,behavior:'smooth'})}})}}
$('#next').addEventListener('click',()=>{const n=mode==='exam'?examQuestions.length:lessons.length;if(index<n&&(mode==='learn'||answers[index])){index++;render();card.scrollTop=0}});$('#prev').addEventListener('click',()=>{if(index>0){index--;render()}});$('#reset').addEventListener('click',e=>{e.preventDefault();setMode('learn')});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$('#mode-toggle').addEventListener('click',()=>{const m=$('#mode-options');m.hidden=!m.hidden;$('#mode-toggle').setAttribute('aria-expanded',String(!m.hidden))});document.addEventListener('click',e=>{if(!e.target.closest('.modebar')){$('#mode-options').hidden=true;$('#mode-toggle').setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&!$('#next').disabled)$('#next').click();if(e.key==='ArrowLeft'&&!$('#prev').disabled)$('#prev').click()});let touchX=0,touchY=0;card.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});card.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&!$('#next').disabled)$('#next').click();else if(dx>0&&!$('#prev').disabled)$('#prev').click()}},{passive:true});function setTopic(t){if(!['burgen','ritter','both'].includes(t))return;topic=t;lessons=t==='ritter'?knightLessons:t==='both'?[...burgLessons,...knightLessons]:burgLessons;extra=t==='ritter'?knightExtra:t==='both'?[...burgExtra,...knightExtra]:burgExtra;document.querySelectorAll('.topic-tab').forEach(b=>{let yes=b.dataset.topic===t;b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes))});setMode(mode)}
